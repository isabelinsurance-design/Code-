<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Team Activity</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:opsz,wght@9..40,400;9..40,500;9..40,600;9..40,700&display=swap" rel="stylesheet">
<style>
:root {
  color-scheme: light;
  --page:#F7F3EC; --card:#FFFFFF; --border:#E8E0D0; --ink:#2C2416; --ink-2:#5C4A30; --muted:#8C7A60;
  --accent:#A07840; --accent-bg:#F0E6D0; --track:#F0EBE1; --bad:#C0392B; --bad-bg:#FDEDEB;
  /* timeline + bar kinds, validated for color-blind separation in light and dark */
  --k-call:#1baf7a; --k-work:#2a78d6; --k-nonWork:#e34948; --k-idle:#eda100; --k-unreviewed:#86b6ef; --k-lunch:#898781; --k-away:#c3c2b7;
  /* status (alerts): fixed in both modes, always paired with a text label */
  --s-warning:#fab219; --s-critical:#d03b3b;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    color-scheme: dark;
    --page:#0d0d0d; --card:#1a1a19; --border:#2c2c2a; --ink:#ffffff; --ink-2:#c3c2b7; --muted:#9a988f;
    --accent:#C9A96E; --accent-bg:#2a2418; --track:#262624; --bad:#e66767; --bad-bg:#2e1716;
    --k-call:#199e70; --k-work:#3987e5; --k-nonWork:#d03b3b; --k-idle:#c98500; --k-unreviewed:#184f95; --k-lunch:#898781; --k-away:#4a4946;
  }
}
:root[data-theme="dark"] {
  color-scheme: dark;
  --page:#0d0d0d; --card:#1a1a19; --border:#2c2c2a; --ink:#ffffff; --ink-2:#c3c2b7; --muted:#9a988f;
  --accent:#C9A96E; --accent-bg:#2a2418; --track:#262624; --bad:#e66767; --bad-bg:#2e1716;
  --k-call:#199e70; --k-work:#3987e5; --k-nonWork:#d03b3b; --k-idle:#c98500; --k-unreviewed:#184f95; --k-lunch:#898781; --k-away:#4a4946;
}
* { box-sizing: border-box; margin: 0; padding: 0; }
body { background: var(--page); color: var(--ink); font: 14px/1.45 'DM Sans', system-ui, -apple-system, 'Segoe UI', sans-serif; -webkit-font-smoothing: antialiased; }
button, input, select { font: inherit; color: inherit; }
a { color: inherit; }
.wrap { max-width: 1440px; margin: 0 auto; padding: 20px 16px 48px; }

/* top bar */
.top { display: flex; flex-wrap: wrap; align-items: center; gap: 12px 20px; margin-bottom: 16px; }
.top h1 { font-size: 22px; font-weight: 700; letter-spacing: -.01em; }
.top h1 small { display: block; font-size: 12px; font-weight: 500; color: var(--muted); letter-spacing: 0; }
.tabs { display: flex; gap: 4px; padding: 3px; border: 1px solid var(--border); border-radius: 10px; background: var(--card); }
.tabs a { padding: 5px 12px; border-radius: 7px; text-decoration: none; color: var(--ink-2); font-weight: 500; }
.tabs a[aria-current] { background: var(--accent-bg); color: var(--ink); font-weight: 600; }
.datenav, .controls { display: flex; flex-wrap: wrap; align-items: center; gap: 6px; }
.datenav input, .controls input { padding: 6px 8px; border: 1px solid var(--border); border-radius: 8px; background: var(--card); }
.btn { padding: 7px 12px; border: 1px solid var(--border); border-radius: 8px; background: var(--card); cursor: pointer; white-space: nowrap; text-decoration: none; display: inline-block; }
.btn:hover { border-color: var(--accent); }
.btn.primary { background: var(--accent); border-color: var(--accent); color: #fff; font-weight: 600; }
.btn[aria-pressed="true"] { background: var(--accent-bg); border-color: var(--accent); font-weight: 600; }
.btn:disabled { opacity: .5; cursor: default; }
.spacer { flex: 1; }
.updated { color: var(--muted); font-size: 12px; }
.bar { display: flex; flex-wrap: wrap; align-items: center; gap: 10px 16px; margin-bottom: 14px; }

.banner { padding: 10px 14px; border-radius: 10px; background: var(--bad-bg); color: var(--bad); margin-bottom: 14px; }
.summary { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 12px; }
.summary span { padding: 6px 12px; border-radius: 999px; background: var(--card); border: 1px solid var(--border); font-weight: 600; }
.legend { display: flex; flex-wrap: wrap; gap: 4px 16px; color: var(--ink-2); font-size: 12px; margin-bottom: 14px; }
.legend i, .sw { display: inline-block; width: 10px; height: 10px; border-radius: 3px; margin-right: 6px; vertical-align: -1px; flex: none; }

/* alerts */
.alerts { background: var(--card); border: 1px solid var(--border); border-radius: 14px; padding: 12px 16px; margin-bottom: 14px; }
.alerts h2 { font-size: 14px; margin-bottom: 6px; }
.alerts ul { list-style: none; display: grid; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); gap: 4px 20px; }
.alerts li { display: flex; gap: 8px; align-items: baseline; font-size: 13px; }
.alerts li b { white-space: nowrap; }
.sdot { display: inline-block; width: 9px; height: 9px; border-radius: 50%; flex: none; transform: translateY(-1px); }
.sdot.warning { background: var(--s-warning); }
.sdot.critical { background: var(--s-critical); }
.alerts.inline { margin: 0; padding: 0; border: 0; background: none; }

/* cards */
.grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(340px, 1fr)); gap: 14px; }
.card { background: var(--card); border: 1px solid var(--border); border-radius: 14px; padding: 16px 18px; display: flex; flex-direction: column; gap: 12px; min-width: 0; }
.card.dim { opacity: .62; }
.head { display: flex; justify-content: space-between; gap: 12px; align-items: baseline; }
.name { font-size: 18px; font-weight: 700; text-transform: uppercase; letter-spacing: .03em; text-decoration: none; }
a.name:hover { text-decoration: underline; text-underline-offset: 3px; }
.state { font-size: 15px; font-weight: 700; white-space: nowrap; }
.sub { margin-top: -8px; display: grid; gap: 1px; }
.detail { color: var(--ink); font-size: 13px; overflow-wrap: anywhere; }
.detail.muted { color: var(--ink-2); }
.clock { color: var(--muted); font-size: 13px; }
.tiles { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; }
.tile { padding: 8px 9px; border-radius: 10px; background: var(--page); min-width: 0; }
.tile b { display: block; font-size: 18px; font-weight: 600; line-height: 1.2; white-space: nowrap; }
.tile span { font-size: 12px; color: var(--muted); }
.tiles.wide { grid-template-columns: repeat(auto-fill, minmax(128px, 1fr)); }
.tiles.wide b { font-size: 22px; }
.note { font-size: 12px; color: var(--muted); }

.strip { position: relative; height: 18px; border-radius: 4px; background: var(--track); }
.strip.big { height: 30px; }
.run { position: absolute; top: 0; bottom: 0; border-radius: 3px; }
.now { position: absolute; top: -3px; bottom: -3px; width: 2px; background: var(--ink); border-radius: 1px; }
.ticks { position: relative; height: 14px; font-size: 10px; color: var(--muted); }
.ticks span { position: absolute; transform: translateX(-50%); white-space: nowrap; }
.ticks span:first-child { transform: none; }

.bars { display: grid; grid-template-columns: minmax(90px, auto) 1fr auto; gap: 6px 10px; align-items: center; font-size: 13px; }
.bars .label { color: var(--ink-2); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.bars .track { height: 10px; }
.bars .bar { height: 10px; border-radius: 0 4px 4px 0; min-width: 2px; }
.bars .val { font-variant-numeric: tabular-nums; color: var(--ink); text-align: right; }
.split { display: flex; gap: 2px; height: 12px; min-width: 120px; border-radius: 4px; overflow: hidden; }
.split i { min-width: 2px; }
.foot { display: flex; flex-wrap: wrap; justify-content: space-between; gap: 4px 12px; font-size: 12px; color: var(--muted); }
.foot .counters { color: var(--ink-2); font-weight: 600; }
details summary { cursor: pointer; color: var(--accent); font-size: 13px; }
table { width: 100%; border-collapse: collapse; font-size: 12px; margin-top: 8px; }
th, td { text-align: left; padding: 5px 8px; border-bottom: 1px solid var(--border); vertical-align: top; }
th { color: var(--muted); font-weight: 500; white-space: nowrap; }
td.n, th.n { text-align: right; font-variant-numeric: tabular-nums; white-space: nowrap; }
td.when { white-space: nowrap; font-variant-numeric: tabular-nums; }
td.muted { color: var(--ink-2); }
tr.gap td { color: var(--muted); font-style: italic; }
tr.mark td { color: var(--ink-2); font-weight: 600; }
td.what { overflow-wrap: anywhere; }
.narrow { display: none; color: var(--ink-2); }
.tablewrap { overflow-x: auto; }
.empty { padding: 40px; text-align: center; color: var(--muted); background: var(--card); border: 1px dashed var(--border); border-radius: 14px; }

/* panels */
.admin { display: grid; grid-template-columns: repeat(auto-fit, minmax(340px, 1fr)); gap: 14px; margin-top: 24px; align-items: start; }
.stack { display: grid; gap: 14px; }
.panel { background: var(--card); border: 1px solid var(--border); border-radius: 14px; padding: 18px; min-width: 0; }
.panel h2 { font-size: 16px; margin-bottom: 4px; }
.panel h3.sec { font-size: 14px; margin: 18px 0 2px; }
.panel .hint { color: var(--muted); font-size: 12px; margin-bottom: 12px; }
.row { display: flex; gap: 8px; align-items: center; padding: 6px 0; border-bottom: 1px solid var(--border); flex-wrap: wrap; }
.row .dom { flex: 1 1 140px; min-width: 0; overflow-wrap: anywhere; }
.row .t { color: var(--muted); font-variant-numeric: tabular-nums; }
select, .panel input[type=text], .panel input[type=time], .panel input[type=number] { padding: 6px 8px; border: 1px solid var(--border); border-radius: 8px; background: var(--card); min-width: 0; }
.panel input[type=number] { width: 80px; }
.cat { margin-top: 14px; }
.cat h3 { font-size: 13px; display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
.cat h3 label { font-weight: 400; color: var(--muted); font-size: 12px; }
.chips { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 6px; }
.chip { display: inline-flex; align-items: center; gap: 4px; padding: 3px 4px 3px 10px; border: 1px solid var(--border); border-radius: 999px; font-size: 12px; }
.chip button { border: 0; background: none; cursor: pointer; color: var(--muted); padding: 0 6px; font-size: 14px; line-height: 1; }
.chip button:hover { color: var(--bad); }
.inline { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 10px; }
.inline input[type=text] { flex: 1 1 160px; }
.form { display: grid; grid-template-columns: 1fr auto; gap: 10px 14px; align-items: center; }
.form label { color: var(--ink-2); }
.days { display: flex; flex-wrap: wrap; gap: 4px 10px; }
.days label { display: inline-flex; gap: 4px; align-items: center; }
.saved { color: var(--k-call); font-size: 13px; margin-left: 10px; }
.person-head { display: flex; flex-wrap: wrap; justify-content: space-between; gap: 6px 16px; align-items: baseline; }
.person-head .name { font-size: 24px; }
.ts { margin-top: 10px; }
.ts > summary { font-size: 14px; font-weight: 600; color: var(--ink); padding: 8px 0; }

#tip { position: fixed; z-index: 10; pointer-events: none; background: var(--ink); color: var(--card); padding: 6px 9px; border-radius: 8px; font-size: 12px; line-height: 1.4; max-width: 260px; display: none; white-space: pre-line; }
.login { max-width: 380px; margin: 12vh auto; background: var(--card); border: 1px solid var(--border); border-radius: 14px; padding: 24px; display: grid; gap: 10px; }
.login input { padding: 9px 10px; border: 1px solid var(--border); border-radius: 8px; background: var(--page); }

/* TV mode: dark, bigger, read-only */
body.tv { font-size: 16px; }
body.tv .wrap { max-width: none; padding: 24px 28px; }
body.tv .grid { grid-template-columns: repeat(auto-fill, minmax(420px, 1fr)); }
body.tv .name { font-size: 24px; }
body.tv .state { font-size: 20px; }
body.tv .detail { font-size: 15px; }
body.tv .tile b { font-size: 22px; }
body.tv .alerts li { font-size: 15px; }
body.tv .admin, body.tv details, body.tv .datenav, body.tv .tabs, body.tv .edit-only { display: none; }
@media (max-width: 480px) { .grid { grid-template-columns: 1fr; } .tiles { grid-template-columns: repeat(2, 1fr); } .form { grid-template-columns: 1fr; } }
@media (max-width: 640px) { .wide-only { display: none; } .narrow { display: block; } td.when { white-space: normal; } }
@media print {
  body { background: #fff; }
  .tabs, .controls, .datenav, #tvBtn, .no-print { display: none !important; }
  .panel, .card { break-inside: avoid; }
  details:not([open]) { display: none; }
}
</style>
</head>
<body>
<div class="wrap" id="app"></div>
<div id="tip"></div>
<script>
const KINDS = [
  ['call', 'On call / after-call'], ['work', 'Work'], ['nonWork', 'Not work'], ['unreviewed', 'Not categorized'],
  ['idle', 'Idle'], ['lunch', 'Lunch / break'], ['away', 'Away (locked)'],
];
const PART_LABELS = [
  ['call', 'On call'], ['wrap', 'After-call work'], ['work', 'Work'], ['nonWork', 'Not work'], ['unreviewed', 'Not categorized'],
  ['idle', 'Idle'], ['lunch', 'Lunch / break'], ['away', 'Away (locked)'],
];
const LIVE_STATES = [
  ['call', '🟢 On call'], ['acw', '🟢 After-call work'], ['working', '🟢 Working'], ['meeting', '👥 Meeting'], ['idle', '🟡 Idle'],
  ['away', '🔒 Away'], ['lunch', '🍴 Lunch'], ['break', '☕ Break'], ['off', '⏹ Clocked out'], ['offline', '🔴 Offline'],
];
const WEEKDAYS = ['Sun', 'Mon', 'Tue', 'Wed', 'Thu', 'Fri', 'Sat'];
const PRESETS = [['week', 'This week'], ['lastweek', 'Last week'], ['month', 'This month'], ['lastmonth', 'Last month'], ['30', 'Last 30 days']];

const params = new URLSearchParams(location.search);
const store = {
  get: k => { try { return localStorage.getItem(k); } catch { return null; } },
  set: (k, v) => { try { localStorage.setItem(k, v); } catch {} },
};
let key = params.get('key') || store.get('wt-key') || '';
if (params.get('key')) store.set('wt-key', key);
let date = params.get('date') || localDate(new Date());
let tv = params.get('tv') === '1';
let view = 'live';        // live | person | reports | settings
let personId = null;
let data = null;          // /api/day
let person = null;        // /api/person
let range = null;         // /api/range
let [rangeFrom, rangeTo] = preset('week');
let cats = null;
let error = '';
let notice = '';
let needKey = !key;
let showShort = false;
let importing = null;     // Nextiva call-history file being imported (Settings tab)
let newestFirst = true;
let seq = 0;
let clockOffset = 0; // server time minus this screen's time, so a TV with a wrong clock still shows correct "min ago"
const now = () => Date.now() + clockOffset;

function localDate(d) {
  return `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}-${String(d.getDate()).padStart(2, '0')}`;
}
const isToday = () => date === localDate(new Date());
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' })[c]);
function dur(seconds) {
  const m = Math.floor((seconds || 0) / 60);
  return m >= 60 ? `${Math.floor(m / 60)}h ${String(m % 60).padStart(2, '0')}m` : `${m}m`;
}
const durTip = seconds => (seconds < 60 ? `${Math.round(seconds)}s` : dur(seconds));
const minSec = seconds => `${Math.floor(seconds / 60)}m ${String(Math.round(seconds % 60)).padStart(2, '0')}s`;
function len(seconds) {
  seconds = Math.round(seconds);
  if (seconds < 60) return `${seconds}s`;
  return seconds < 600 ? minSec(seconds) : dur(seconds);
}
const pct = p => (p == null ? '–' : `${Math.round(p * 100)}%`);
const clock = t => new Date(t).toLocaleTimeString([], { hour: 'numeric', minute: '2-digit' });
const since = t => (t ? dur((now() - t) / 1000) : '');
const ago = t => {
  const m = Math.round((now() - t) / 60000);
  if (m < 1) return 'just now';
  return m < 60 ? `${m} min ago` : `${dur(m * 60)} ago`;
};
const longDate = d => new Date(`${d}T12:00:00`).toLocaleDateString([], { weekday: 'long', month: 'long', day: 'numeric', year: 'numeric' });
const shortDate = d => new Date(`${d}T12:00:00`).toLocaleDateString([], { weekday: 'short', month: 'short', day: 'numeric' });
function site(domain) {
  return { '(outside chrome)': 'another app (outside Chrome)', '(browser)': 'a browser page', '(local file)': 'a local file' }[domain] || domain || '';
}
const slotMinutes = slot => Number(slot.slice(0, 2)) * 60 + Number(slot.slice(3));
const hhmm = m => new Date(2000, 0, 1, Math.floor(m / 60), m % 60).toLocaleTimeString([], { hour: 'numeric', minute: '2-digit' });
const personLink = (id, text, d) =>
  tv ? esc(text) : `<a href="#person/${encodeURIComponent(id)}"${d ? ` data-date="${d}"` : ''}>${esc(text)}</a>`;

function preset(name) {
  const t = new Date();
  const monday = new Date(t);
  monday.setDate(t.getDate() - ((t.getDay() + 6) % 7));
  const shift = (d, days) => { const x = new Date(d); x.setDate(x.getDate() + days); return x; };
  switch (name) {
    case 'lastweek': return [localDate(shift(monday, -7)), localDate(shift(monday, -1))];
    case 'month': return [localDate(new Date(t.getFullYear(), t.getMonth(), 1)), localDate(t)];
    case 'lastmonth': return [localDate(new Date(t.getFullYear(), t.getMonth() - 1, 1)), localDate(new Date(t.getFullYear(), t.getMonth(), 0))];
    case '30': return [localDate(shift(t, -29)), localDate(t)];
    default: return [localDate(monday), localDate(t)];
  }
}

async function api(path, options = {}) {
  const res = await fetch(path, { ...options, headers: { 'Content-Type': 'application/json', 'X-Admin-Key': key } });
  if (res.status === 401) {
    needKey = true;
    render();
    throw new Error('unauthorized');
  }
  const body = await res.json().catch(() => ({}));
  if (!res.ok) throw Object.assign(new Error(body.error || `HTTP ${res.status}`), { status: res.status });
  return body;
}

function route() {
  const hash = decodeURIComponent(location.hash.slice(1));
  if (hash.startsWith('person/')) {
    view = 'person';
    personId = hash.slice(7);
  } else {
    view = ['reports', 'settings'].includes(hash) ? hash : 'live';
  }
  if (tv) view = 'live';
}

async function refresh() {
  if (needKey) return render();
  const ticket = ++seq;
  try {
    if (view === 'person') {
      const p = await api(`api/person?date=${date}&id=${encodeURIComponent(personId)}`);
      if (ticket !== seq) return;
      person = p;
      clockOffset = p.serverTime - Date.now();
    } else if (view === 'reports') {
      const r = await api(`api/range?from=${rangeFrom}&to=${rangeTo}`);
      if (ticket !== seq) return;
      range = r;
    } else {
      // Live, and Settings (which lists today's people for per-person shifts).
      const day = view === 'settings' ? localDate(new Date()) : date;
      const [d, c] = await Promise.all([api(`api/day?date=${day}`), tv ? cats : api('api/categories')]);
      if (ticket !== seq) return;
      data = d;
      cats = c;
      clockOffset = d.serverTime - Date.now();
    }
    error = '';
  } catch (err) {
    if (ticket !== seq || err.message === 'unauthorized') return;
    if (err.status === 404 && view === 'person') {
      person = { missing: true };
      error = '';
    } else {
      error = `Can't reach the tracker server (${err.message}). Retrying every 30 seconds…`;
    }
  }
  render();
}

// ---------- live status ----------

// Returns the status line and the detail lines under it.
function liveLine(l) {
  const crm = [];
  if (l.crm && now() - l.crm.at < 12 * 3600e3) {
    // Member names stay off the shared TV screen.
    const record = l.state === 'call' ? l.contact || l.crm.record : l.crm.record;
    if (record && !tv) crm.push(`CRM record open: ${record}`);
    crm.push(`Last CRM action ${ago(l.crm.at)} (${l.crm.action.replace(/_/g, ' ')})`);
  }
  switch (l.state) {
    case 'call': return [`🟢 On call ${since(l.since)}`, [l.direction ? `${l.direction} call` : l.source === 'chrome' ? 'Nextiva call (in Chrome)' : 'Phone call', ...crm]];
    case 'acw': return [`🟢 After-call work ${since(l.since)}`, ['wrapping up the last call', ...crm]];
    case 'working':
      if (l.work === false) return [`🟠 Not work ${since(l.since)}`, [site(l.domain)]];
      if (!l.category) return [`🟢 Working ${since(l.since)}`, [`${site(l.domain)} (not categorized)`, ...crm]];
      return [`🟢 ${l.category === 'CRM' ? 'CRM work' : l.category} ${since(l.since)}`, [site(l.domain), ...crm]];
    case 'meeting': return [`👥 Meeting / training ${since(l.since)}`, [l.since ? `since ${clock(l.since)}` : '']];
    case 'idle': return [`🟡 Idle ${since(l.since)}`, ['no keyboard or mouse for 5+ min', ...crm]];
    case 'away': return [`🔒 Away ${since(l.since)}`, ['computer locked']];
    case 'lunch': return [`🍴 Lunch ${since(l.since)}`, [l.since ? `since ${clock(l.since)}` : '']];
    case 'break': return [`☕ Break ${since(l.since)}`, [l.since ? `since ${clock(l.since)}` : '']];
    case 'off': return ['⏹ Clocked out', [l.since ? `at ${clock(l.since)}` : '']];
    default: return ['🔴 Offline', [l.lastSeen ? `last seen ${ago(l.lastSeen)}` : 'extension not connected', ...crm]];
  }
}

function alertText(a) {
  const m = dur(a.minutes * 60);
  switch (a.type) {
    case 'late': return `Late: clocked in ${dur(a.minutes * 60)} after the ${clock(a.shift)} shift start`;
    case 'absent': return isToday() && view !== 'reports' ? `Not clocked in (shift started ${clock(a.shift)})` : `No activity (shift ${clock(a.shift)})`;
    case 'idle': return `Idle for ${m}, no call`;
    case 'away': return `Computer locked for ${m}, not on break`;
    case 'nonWorkNow': return `On ${site(a.domain)} (not work) for ${m}`;
    case 'lunchNow': return `At lunch ${m} (limit ${dur(a.limit * 60)})`;
    case 'offline': return `Tracker offline ${m} without clocking out`;
    case 'lunchTotal': return `Lunch ${m} (limit ${dur(a.limit * 60)})`;
    case 'breakTotal': return `Breaks ${m} (limit ${dur(a.limit * 60)})`;
    case 'nonWorkDay': return `${m} on not-work sites`;
    default: return a.type;
  }
}

function alertsPanel(employees) {
  const rows = employees
    .flatMap(e => (e.alerts || []).map(a => ({ e, a })))
    .sort((x, y) => (x.a.level === 'critical' ? 0 : 1) - (y.a.level === 'critical' ? 0 : 1) || x.e.name.localeCompare(y.e.name));
  if (!rows.length) return '';
  return `<section class="alerts" aria-label="Alerts"><h2>Needs attention (${rows.length})</h2><ul>
    ${rows.map(({ e, a }) => `<li><i class="sdot ${a.level}"></i><span><b>${personLink(e.id, e.name)}</b> · ${esc(alertText(a))}</span></li>`).join('')}
  </ul></section>`;
}

// ---------- card pieces ----------

function timeline(e, big) {
  const slots = e.timeline;
  const current = new Date(now());
  const nowMin = isToday() ? current.getHours() * 60 + current.getMinutes() : null;
  const first = slots.length ? slotMinutes(slots[0].slot) : 8 * 60;
  const last = slots.length ? slotMinutes(slots[slots.length - 1].slot) + 5 : 17 * 60;
  const start = Math.min(7 * 60, Math.floor(first / 60) * 60);
  const end = Math.min(24 * 60, Math.max(18 * 60, Math.ceil(last / 60) * 60, nowMin != null ? Math.ceil((nowMin + 1) / 60) * 60 : 0));
  const span = end - start;

  // Merge back-to-back slots of the same kind into one run.
  const runs = [];
  for (const s of slots) {
    const m = slotMinutes(s.slot);
    const prev = runs[runs.length - 1];
    if (prev && prev.kind === s.kind && prev.end === m) {
      prev.end = m + 5;
      for (const k in s.parts) prev.parts[k] += s.parts[k];
    } else {
      runs.push({ kind: s.kind, start: m, end: m + 5, parts: { ...s.parts } });
    }
  }
  const pctOf = m => ((m - start) / span) * 100;
  const runHtml = runs.map(r => {
    const detail = PART_LABELS.filter(([k]) => r.parts[k] >= 5).map(([k, label]) => `${label} ${durTip(r.parts[k])}`).join('\n');
    const tip = `${hhmm(r.start)} – ${hhmm(r.end)}\n${detail}`;
    return `<div class="run" data-tip="${esc(tip)}" style="left:${pctOf(r.start)}%;width:calc(${pctOf(r.end) - pctOf(r.start)}% - 2px);background:var(--k-${r.kind})"></div>`;
  }).join('');
  const nowMark = nowMin != null && nowMin > start && nowMin < end ? `<div class="now" style="left:${pctOf(nowMin)}%" data-tip="Now"></div>` : '';
  const step = span > 10 * 60 ? (big ? 60 : 180) : big ? 60 : 120;
  let ticks = '';
  for (let m = start; m < end; m += step) ticks += `<span style="left:${pctOf(m)}%">${hhmm(m).replace(':00', '').replace(/\s?([AP])M/i, (_, x) => x.toLowerCase())}</span>`;
  return `<div><div class="strip${big ? ' big' : ''}" role="img" aria-label="Activity timeline for ${esc(e.name)}">${runHtml}${nowMark}</div><div class="ticks">${ticks}</div></div>`;
}

function bars(activities) {
  if (!activities.length) return '';
  const max = Math.max(...activities.map(a => a.seconds));
  return `<div class="bars">${activities.map(a => `<span class="label" title="${esc(a.name)}">${esc(a.name)}</span>
      <div class="track"><div class="bar" style="width:${(a.seconds / max) * 100}%;background:var(--k-${a.kind})" data-tip="${esc(`${a.name}\n${dur(a.seconds)}`)}"></div></div>
      <span class="val">${a.seconds < 60 ? '<1m' : dur(a.seconds)}</span>`).join('')}</div>`;
}

function sitesTable(domains, open) {
  if (!domains.length) return '';
  return `<details${open ? ' open' : ''}><summary>Sites on screen (${domains.length})</summary><div class="tablewrap"><table>
    <tr><th>Site</th><th>Category</th><th class="n">Active</th><th class="n">Idle</th></tr>
    ${domains.map(d => `<tr><td>${esc(site(d.domain))}</td><td>${esc(d.category || 'Not categorized')}</td><td class="n">${dur(d.active)}</td><td class="n">${dur(d.idle)}</td></tr>`).join('')}
  </table></div></details>`;
}

function clockLine(e) {
  if (!e.clockIn) return e.shift ? `Not clocked in · shift ${clock(e.shift)}` : 'Not clocked in';
  let line = `Clock in ${clock(e.clockIn)}`;
  if (e.clockOut) line += ` · out ${clock(e.clockOut)}`;
  if (e.loggedIn) line += ` · logged in ${dur(e.loggedIn)}`;
  return line;
}

function tracked(e) {
  const t = e.totals;
  return e.working + t.nonWork + t.unreviewed + t.idle + t.away + t.lunch + t.break;
}

function card(e) {
  const today = isToday();
  const l = e.live;
  const t = e.totals;
  const untracked = e.loggedIn - tracked(e);
  const [state, details] = today ? liveLine(l) : ['', []];
  const c = e.calls;
  const stats = [
    c.count ? `Calls ${c.count}` : '',
    c.count && c.connected ? `Connected ${c.connected}` : '',
    c.avgHandle ? `Avg handle ${minSec(c.avgHandle)}` : '',
    ...Object.entries(e.counters || {}).map(([k, v]) => `${esc(k)} ${esc(v)}`),
  ].filter(Boolean).join(' · ');
  const crmLine = e.crm.open >= 60 || e.crm.actions
    ? `CRM open ${dur(e.crm.open)} · CRM work ${dur(e.crm.active)}${e.crm.actions ? ` · ${e.crm.actions} CRM actions` : ''}`
    : '';
  const hasData = tracked(e) > 0;
  const name = tv ? `<span class="name">${esc(e.name)}</span>` : `<a class="name" href="#person/${encodeURIComponent(e.id)}">${esc(e.name)}</a>`;

  return `<article class="card${!hasData && (!today || l.state === 'offline') ? ' dim' : ''}">
    <div class="head">${name}${today ? `<span class="state">${esc(state)}</span>` : ''}</div>
    <div class="sub">${details.filter(Boolean).map((d, i) => `<span class="detail${i ? ' muted' : ''}">${esc(d)}</span>`).join('')}<span class="clock">${clockLine(e)}</span></div>
    ${hasData ? `
    <div class="tiles">
      <div class="tile"><b>${dur(e.working)}</b><span>Working</span></div>
      <div class="tile"><b>${pct(e.productivity)}</b><span>Productive</span></div>
      <div class="tile"><b>${dur(t.idle + t.away)}</b><span>Idle / away</span></div>
      <div class="tile"><b>${dur(t.lunch + t.break)}</b><span>Lunch/break</span></div>
    </div>
    ${timeline(e)}
    ${bars(e.activities)}
    ${crmLine ? `<div class="note">${crmLine}</div>` : ''}
    ${untracked > 600 ? `<div class="note">${dur(untracked)} unaccounted (no calls, Chrome closed or computer asleep)</div>` : ''}
    ${tv ? '' : `<div class="note"><a href="#person/${encodeURIComponent(e.id)}">Activity log, minute by minute →</a></div>`}` : `<div class="note">${today ? 'No activity recorded yet today.' : 'No activity recorded this day.'}</div>`}
    <div class="foot">
      <span>${today && l.lastActiveAt && l.state !== 'call' ? `Last keyboard/mouse ${ago(l.lastActiveAt)}` : ''}</span>
      ${stats ? `<span class="counters">${stats}</span>` : ''}
    </div>
  </article>`;
}

// ---------- views ----------

function dateNav() {
  const today = isToday();
  return `<div class="datenav"><button class="btn" data-day="-1" aria-label="Previous day">←</button>
    <input type="date" id="date" value="${date}" max="${localDate(new Date())}" aria-label="Day">
    <button class="btn" data-day="1" aria-label="Next day" ${today ? 'disabled' : ''}>→</button>
    ${today ? '' : '<button class="btn" data-day="0">Today</button>'}</div>`;
}

function legend() {
  return `<div class="legend">${KINDS.map(([k, label]) => `<span><i style="background:var(--k-${k})"></i>${label}</span>`).join('')}<span><i style="background:var(--track);outline:1px solid var(--border)"></i>No data</span></div>`;
}

function liveView() {
  const today = isToday();
  const employees = data ? data.employees : [];
  const counts = {};
  for (const e of employees) counts[e.live.state] = (counts[e.live.state] || 0) + 1;
  const summary = LIVE_STATES.filter(([k]) => counts[k]).map(([k, label]) => `<span>${label} ${counts[k]}</span>`).join('');
  return `
    <div class="bar">${dateNav()}<span class="spacer"></span>
      <span class="updated">${data ? `${today ? 'Today' : esc(longDate(date))} · updated ${new Date(data.serverTime).toLocaleTimeString([], { hour: 'numeric', minute: '2-digit', second: '2-digit' })}` : 'Loading…'}</span></div>
    ${alertsPanel(employees)}
    ${today && summary ? `<div class="summary">${summary}</div>` : ''}
    ${legend()}
    ${data && !employees.length ? `<div class="empty">No one has connected yet. Install the Chrome extension on each computer and enter this server's address and the tracker key in its Settings.</div>` : ''}
    <div class="grid">${employees.map(card).join('')}</div>
    ${tv ? '' : unassignedPanel()}`;
}

function logKind(x) {
  if (x.state === 'call') return 'call';
  if (x.state === 'active') return x.work === true ? 'work' : x.work === false ? 'nonWork' : 'unreviewed';
  if (x.state === 'meeting') return 'work';
  if (x.state === 'break') return 'lunch';
  return x.state; // idle | away | lunch
}

function logRow(x) {
  const cap = s => s.charAt(0).toUpperCase() + s.slice(1);
  let what;
  let notes;
  switch (x.state) {
    case 'call':
      what = `📞 ${x.direction ? cap(x.direction) : x.source === 'chrome' ? 'Nextiva' : 'Phone'} call${x.live ? ' (now)' : ''}`;
      notes = x.source === 'chrome' ? 'heard in Nextiva in Chrome'
        : [x.outcome && x.outcome.replace('-', ' '), x.recordId && `record ${x.recordId}`].filter(Boolean).join(' · ');
      break;
    case 'active':
      what = site(x.domain) || 'Unknown site';
      notes = !x.category ? 'Not categorized' : x.work === false && !/not work/i.test(x.category) ? `${x.category} (not work)` : x.category;
      break;
    case 'idle': what = 'Idle'; notes = x.domain ? `no keyboard or mouse · ${site(x.domain)} in front` : 'no keyboard or mouse'; break;
    case 'away': what = 'Computer locked'; notes = ''; break;
    case 'lunch': what = '🍴 Lunch'; notes = ''; break;
    case 'break': what = '☕ Break'; notes = ''; break;
    case 'meeting': what = '👥 Meeting / training'; notes = ''; break;
    default: what = x.state; notes = '';
  }
  if (x.duringCall) notes = [notes, 'during a call'].filter(Boolean).join(' · ');
  if (x.skipped) notes = [notes, `interrupted by ${x.skipped} short visit${x.skipped === 1 ? '' : 's'}`].filter(Boolean).join(' · ');
  const seconds = ((x.to || now()) - x.from) / 1000;
  return `<tr><td class="when">${clock(x.from)} – ${clock(x.to || now())}</td><td class="n">${len(seconds)}</td>
    <td class="what"><i class="sw" style="background:var(--k-${logKind(x)})"></i>${esc(what)}${notes ? `<span class="narrow">${esc(notes)}</span>` : ''}</td>
    <td class="muted wide-only">${esc(notes)}</td></tr>`;
}

// Every site visit, idle stretch, break and call in time order, with gaps where nothing was recorded.
function activityLog(p) {
  const e = p.employee;
  const calls = p.calls.map(c => ({ ...c, state: 'call', to: c.to || now() }));
  const entries = [...p.log, ...calls].sort((a, b) => a.from - b.from || (a.state === 'call' ? -1 : 1));
  for (const x of entries) {
    if (x.state !== 'call') x.duringCall = calls.some(c => c.from < x.to && c.to > x.from);
  }
  const rows = [];
  const mark = (at, text) => rows.push({ at, html: `<tr class="mark"><td class="when">${clock(at)}</td><td></td><td colspan="2">${esc(text)}</td></tr>` });
  let hidden = 0;
  let skipped = 0;
  let reach = null;
  let prev = null; // last shown site entry, so a site interrupted only by hidden short visits stays one row
  if (e.clockIn) mark(e.clockIn, `Clocked in${e.shift ? ` (shift ${clock(e.shift)})` : ''}`);
  for (const x of entries) {
    if (reach && x.from - reach > 120000) {
      rows.push({ at: reach, html: `<tr class="gap"><td class="when">${clock(reach)} – ${clock(x.from)}</td><td class="n">${len((x.from - reach) / 1000)}</td><td colspan="2">Nothing recorded (Chrome closed, computer asleep or clocked out)</td></tr>` });
      prev = null;
    }
    reach = Math.max(reach || 0, x.to);
    if (x.state === 'call') {
      rows.push({ at: x.from, x });
      continue;
    }
    if (!showShort && x.to - x.from < 30000) {
      hidden++;
      skipped++;
      continue;
    }
    if (prev && skipped && prev.state === x.state && prev.domain === x.domain) {
      prev.to = x.to;
      prev.skipped = (prev.skipped || 0) + skipped;
      prev.duringCall ||= x.duringCall;
    } else {
      prev = { ...x };
      rows.push({ at: x.from, x: prev });
    }
    skipped = 0;
  }
  if (e.clockOut) mark(e.clockOut, 'Clocked out');
  rows.sort((a, b) => a.at - b.at);
  for (const r of rows) if (r.x) r.html = logRow(r.x);
  if (newestFirst) rows.reverse();

  const switches = p.log.filter(x => x.state === 'active').length;
  const sites = new Set(p.log.filter(x => x.domain).map(x => x.domain)).size;
  return `<section class="panel">
    <h2>Activity log</h2>
    <p class="hint">Everything that was in front of ${esc(e.name)} in Chrome, plus phone calls, breaks and idle time. ${switches} site visits on ${sites} sites.
      Only site names and times are recorded, never page contents.</p>
    <div class="controls no-print">
      <label><input type="checkbox" id="newestFirst" ${newestFirst ? 'checked' : ''}> Newest first</label>
      <label><input type="checkbox" id="showShort" ${showShort ? 'checked' : ''}> Show visits under 30 seconds${hidden ? ` (${hidden} hidden)` : ''}</label>
    </div>
    ${rows.length ? `<div class="tablewrap"><table>
      <tr><th>Time</th><th class="n">Length</th><th>What</th><th class="wide-only">Details</th></tr>
      ${rows.map(r => r.html).join('')}
    </table></div>` : '<p class="note" style="margin-top:10px">Nothing recorded this day. (The minute-by-minute log starts with extension version 1.2.)</p>'}
  </section>`;
}

function personView() {
  const back = '<a class="btn no-print" href="#live">← Team</a>';
  if (!person) return `<div class="bar">${back}${dateNav()}</div><p class="note">Loading…</p>`;
  if (person.missing) return `<div class="bar">${back}${dateNav()}</div><div class="empty">No one by that name on this day.</div>`;
  const e = person.employee;
  const t = e.totals;
  const c = e.calls;
  const [state, details] = isToday() ? liveLine(e.live) : ['', []];
  const callLine = c.count
    ? `Calls ${c.count} · connected ${c.connected} · talk ${dur(c.talk)} · after-call work ${dur(c.wrap)}${c.avgHandle ? ` · avg handle ${minSec(c.avgHandle)}` : ''}`
    : '';
  return `
    <div class="bar">${back}${dateNav()}<span class="spacer"></span><button class="btn no-print" data-print>Print</button></div>
    <div class="stack">
      <section class="panel">
        <div class="person-head"><span class="name">${esc(e.name)}</span>${state ? `<span class="state">${esc(state)}</span>` : ''}</div>
        <div class="sub" style="margin:6px 0 12px">${details.filter(Boolean).map((d, i) => `<span class="detail${i ? ' muted' : ''}">${esc(d)}</span>`).join('')}
          <span class="clock">${isToday() ? '' : `${esc(longDate(date))} · `}${clockLine(e)}</span></div>
        ${e.alerts.length ? `<section class="alerts inline"><ul>${e.alerts.map(a => `<li><i class="sdot ${a.level}"></i><span>${esc(alertText(a))}</span></li>`).join('')}</ul></section>` : ''}
        <div class="tiles wide" style="margin-top:12px">
          <div class="tile"><b>${dur(e.loggedIn)}</b><span>Logged in</span></div>
          <div class="tile"><b>${dur(e.working)}</b><span>Working</span></div>
          <div class="tile"><b>${pct(e.productivity)}</b><span>Productive</span></div>
          <div class="tile"><b>${dur(t.idle + t.away)}</b><span>Idle / away</span></div>
          <div class="tile"><b>${dur(t.lunch + t.break)}</b><span>Lunch / break</span></div>
          <div class="tile"><b>${dur(t.nonWork)}</b><span>Not work</span></div>
          <div class="tile"><b>${c.count}</b><span>Calls</span></div>
          <div class="tile"><b>${e.crm.actions}</b><span>CRM actions</span></div>
        </div>
      </section>
      <section class="panel">
        <h2>Day at a glance</h2>
        <p class="hint">Each block is 5 minutes, colored by what took most of it. Hover for details.</p>
        ${legend()}
        ${timeline(e, true)}
        <h3 class="sec">Where the time went</h3>
        <p class="hint">${esc(callLine)}</p>
        ${bars(e.activities) || '<p class="note">No activity yet.</p>'}
        <div style="margin-top:12px">${sitesTable(e.domains, false)}</div>
      </section>
      ${activityLog(person)}
    </div>`;
}

function splitBar(t) {
  const parts = [
    ['call', t.talk + t.wrap, 'On call / after-call'], ['work', t.working - t.talk - t.wrap, 'Work'], ['nonWork', t.nonWork, 'Not work'],
    ['unreviewed', t.unreviewed, 'Not categorized'], ['idle', t.idle, 'Idle'], ['lunch', t.lunch + t.break, 'Lunch / break'], ['away', t.away, 'Away (locked)'],
  ].filter(([, s]) => s > 0);
  const total = parts.reduce((s, [, x]) => s + x, 0);
  if (!total) return '';
  return `<div class="split" role="img" aria-label="Time split">${parts.filter(([, s]) => s / total >= 0.005)
    .map(([k, s, label]) => `<i style="flex:${s} 1 0;background:var(--k-${k})" data-tip="${esc(`${label}\n${dur(s)} (${Math.round((s / total) * 100)}%)`)}"></i>`).join('')}</div>`;
}

function reportsView() {
  const presets = PRESETS.map(([k, label]) => {
    const [f, t] = preset(k);
    return `<button class="btn" data-preset="${k}" aria-pressed="${f === rangeFrom && t === rangeTo}">${label}</button>`;
  }).join('');
  const controls = `<div class="controls">${presets}
    <input type="date" id="rangeFrom" value="${rangeFrom}" max="${localDate(new Date())}" aria-label="From">
    <span class="note">to</span>
    <input type="date" id="rangeTo" value="${rangeTo}" max="${localDate(new Date())}" aria-label="To">

    <button class="btn" data-csv="timesheet" ${range && range.employees.length ? '' : 'disabled'}>⬇ Timesheet CSV</button>
    <button class="btn" data-csv="summary" ${range && range.employees.length ? '' : 'disabled'}>⬇ Summary CSV</button>
    <button class="btn" data-print>Print</button></div>`;
  const heading = `<p class="note" style="margin:10px 0 14px">${esc(shortDate(rangeFrom))} – ${esc(shortDate(rangeTo))}</p>`;
  if (!range) return `${controls}${heading}<p class="note">Loading…</p>`;

  if (!people.length) return `${controls}${heading}<div class="empty">No activity in these dates.</div>`;

  const team = `<section class="panel" style="margin-bottom:14px"><div class="tiles wide">
    <div class="tile"><b>${people.length}</b><span>People</span></div>
    <div class="tile"><b>${dur(sum('working'))}</b><span>Working, all</span></div>
    <div class="tile"><b>${pct(counted >= 300 ? sum('working') / counted : null)}</b><span>Productive, team</span></div>
    <div class="tile"><b>${sum('calls')}</b><span>Calls</span></div>
    <div class="tile"><b>${sum('crmActions')}</b><span>CRM actions</span></div>
    <div class="tile"><b>${people.reduce((s, p) => s + p.lateDays, 0)}</b><span>Late arrivals</span></div>
    <div class="tile"><b>${people.reduce((s, p) => s + p.missedDays, 0)}</b><span>Missed shifts</span></div>
  </div></section>`;

  const summary = `<section class="panel"><h2>Summary by person</h2>
    <p class="hint">Productive = working ÷ (working + not work + idle + away). Lunch, breaks and sites not categorized yet don't count against anyone.</p>
    ${legend()}
    <div class="tablewrap"><table>
      <tr><th>Employee</th><th class="n">Days</th><th class="n">Logged in</th><th class="n">Working</th><th class="n">Productive</th><th>Time split</th>
        <th class="n">Idle / away</th><th class="n">Lunch / break</th><th class="n">Not work</th><th class="n">Calls</th><th class="n">Avg handle</th>
        <th class="n">CRM actions</th><th class="n">Late</th><th class="n">Missed</th></tr>
      ${people.map(p => {
        const t = p.totals;
        return `<tr><td><b>${esc(p.name)}</b></td><td class="n">${p.daysWorked}</td><td class="n">${dur(t.loggedIn)}</td><td class="n">${dur(t.working)}</td>
          <td class="n">${pct(p.productivity)}</td><td style="min-width:140px;vertical-align:middle">${splitBar(t)}</td>
          <td class="n">${dur(t.idle + t.away)}</td><td class="n">${dur(t.lunch + t.break)}</td><td class="n">${dur(t.nonWork)}</td>
          <td class="n">${t.calls}</td><td class="n">${p.avgHandle ? minSec(p.avgHandle) : '–'}</td><td class="n">${t.crmActions}</td>
          <td class="n">${p.lateDays || ''}</td><td class="n">${p.missedDays || ''}</td></tr>`;
      }).join('')}
    </table></div></section>`;

  const timesheets = `<section class="panel"><h2>Daily timesheets</h2>
    <p class="hint">Click a day to open that person's minute-by-minute activity log.</p>
    ${people.map(p => `<details class="ts"><summary>${esc(p.name)} · ${p.daysWorked} day${p.daysWorked === 1 ? '' : 's'} · ${dur(p.totals.working)} working</summary>
      <div class="tablewrap"><table>
        <tr><th>Day</th><th>In</th><th>Out</th><th class="n">Logged in</th><th class="n">Working</th><th class="n">Productive</th><th class="n">Idle / away</th>

// ---------- CSV ----------

function downloadCsv(name, rows) {
  const cell = v => {
    if (v == null) return '';
    let s = String(v);
    if (typeof v === 'string' && /^[=+\-@\t\r]/.test(s)) s = `'${s}`; // keep spreadsheet formulas out
    return /[",\r\n]/.test(s) ? `"${s.replace(/"/g, '""')}"` : s;
  };
  const csv = rows.map(r => r.map(cell).join(',')).join('\r\n');
  const a = document.createElement('a');
  a.href = URL.createObjectURL(new Blob(['﻿' + csv], { type: 'text/csv;charset=utf-8' }));
  a.download = name;
  document.body.append(a);
  a.click();
  a.remove();
  setTimeout(() => URL.revokeObjectURL(a.href), 1000);
}

const hours = s => Math.round((s / 3600) * 100) / 100;
const percent = p => (p == null ? '' : Math.round(p * 100));
const time24 = t => (t ? new Date(t).toLocaleTimeString([], { hour: '2-digit', minute: '2-digit', hour12: false }) : '');

// ---------- Nextiva call-history import ----------
// Calls made in Nextiva in Chrome are picked up live by the extension. Calls in
// the Nextiva desktop app (or a desk phone) come from Nextiva's call history:
// Call History → Download CSV. The file is read here in the browser; only the
// person, start time, length, direction and result are sent, never phone numbers.

function parseCsv(text) {
  const rows = [];
  let row = [];
  let cell = '';
  let quoted = false;
  text = text.replace(/^\ufeff/, '');
  for (let i = 0; i < text.length; i++) {
    const ch = text[i];
    if (quoted) {
      if (ch !== '"') cell += ch;
      else if (text[i + 1] === '"') { cell += '"'; i++; }
      else quoted = false;
    } else if (ch === '"') quoted = true;
    else if (ch === ',') { row.push(cell); cell = ''; }
    else if (ch === '\n' || ch === '\r') {
      if (ch === '\r' && text[i + 1] === '\n') i++;
      row.push(cell);
      rows.push(row);
      row = [];
      cell = '';
    } else cell += ch;
  }
  if (cell || row.length) rows.push([...row, cell]);
  return rows.filter(r => r.some(c => c.trim()));
}

const COLUMNS = [
  ['when', 'Date and time the call started', true],
  ['time', 'Time (if it is in its own column)', false],
  ['duration', 'Duration', true],
  ['person', 'Person (user, name or extension)', true],
  ['direction', 'Direction or call type', false],
  ['result', 'Result or status', false],
];

function guessColumns(headers) {
  const find = (...patterns) => {
    for (const p of patterns) {
      const i = headers.findIndex(h => p.test(h));
      if (i >= 0) return i;
    }
    return -1;
  };
  const when = find(/start.*(date|time)/i, /date.*time|time.*date/i, /^(call )?date$/i, /date/i, /time/i);
  const time = /time/i.test(headers[when] || '') ? -1 : headers.findIndex((h, i) => i !== when && /^(start )?time$|^time/i.test(h.trim()));
  return {
    when,
    time,
    duration: find(/duration/i, /length/i, /talk ?time/i, /seconds/i),
    person: find(/^user ?name$/i, /^user$/i, /user/i, /agent/i, /employee/i, /^name$/i, /extension/i),
    direction: find(/direction/i, /call ?type/i, /^type$/i),
    result: find(/result/i, /status/i, /disposition/i, /answer/i),
  };
}

function parseDuration(v) {
  v = String(v || '').trim().toLowerCase();
  let m;
  if ((m = v.match(/^(\d+):(\d{1,2}):(\d{1,2})(\.\d+)?$/))) return +m[1] * 3600 + +m[2] * 60 + +m[3];
  if ((m = v.match(/^(\d+):(\d{1,2})(\.\d+)?$/))) return +m[1] * 60 + +m[2];
  if (/^\d+(\.\d+)?$/.test(v)) return Math.round(Number(v));
  const h = v.match(/(\d+)\s*h/);
  const mi = v.match(/(\d+)\s*m(?!s)/);
  const se = v.match(/(\d+)\s*s/);
  return h || mi || se ? (h ? +h[1] * 3600 : 0) + (mi ? +mi[1] * 60 : 0) + (se ? +se[1] : 0) : null;
}

function callFromRow(row, map) {
  const text = `${row[map.when] || ''} ${map.time >= 0 ? row[map.time] || '' : ''}`.trim();
  const start = text.includes(':') ? Date.parse(text) : NaN;
  const seconds = parseDuration(row[map.duration]);
  const person = String(row[map.person] || '').trim();
  if (!Number.isFinite(start) || seconds == null || !person) return null;
  const d = String(map.direction >= 0 ? row[map.direction] : '').toLowerCase();
  const both = `${d} ${String(map.result >= 0 ? row[map.result] : '').toLowerCase()}`;
  const direction = /out|placed|dial/.test(d) ? 'outbound' : /\bin|received|incoming|missed/.test(d) ? 'inbound' : null;
  const outcome = /miss|no.?answer|unanswered|not answered|abandon/.test(both) ? 'no-answer'
    : /voice ?mail/.test(both) ? 'voicemail'
    : /busy/.test(both) ? 'busy'
    : /fail|error/.test(both) ? 'failed'
    : /answer|connect|complet|success/.test(both) || seconds > 0 ? 'connected' : 'no-answer';
  return { person, start, seconds, direction, outcome };
}

// "Arlet Gomez (1023)" → the tracker's "arlet", when the names line up.
function matchPerson(label, employees) {
  const words = label.toLowerCase().split(/[^a-z0-9]+/).filter(Boolean);
  const hit = employees.find(e => e.id === label.toLowerCase())
    || employees.find(e => e.id.includes(' ') && e.id.split(' ').every(w => words.includes(w)))
    || employees.find(e => words[0] === e.id)
    || employees.find(e => words.includes(e.id));
  return hit ? hit.id : '';
}

function readCallFile(file) {
  const reader = new FileReader();
  reader.onload = () => {
    const rows = parseCsv(String(reader.result));
    // Reports often start with a title or date-range line; the header row is the first one naming a date and a duration.
    let at = rows.findIndex(r => r.some(c => /date|time/i.test(c)) && r.some(c => /duration|length/i.test(c)));
    if (at < 0) at = 0;
    const headers = (rows[at] || []).map(h => h.trim());
    importing = { name: file.name, headers, rows: rows.slice(at + 1), map: guessColumns(headers), people: {}, result: '' };
    render();
  };
  reader.readAsText(file);
}

function importPlan() {
  const { map, rows } = importing;
  const employees = data.employees;
  const saved = data.settings.phoneUsers || {};
  const calls = [];
  let unreadable = 0;
  if (COLUMNS.every(([k, , required]) => !required || map[k] >= 0)) {
    for (const row of rows) {
      const call = callFromRow(row, map);
      if (call) calls.push(call);
      else unreadable++;
    }
  } else {
    unreadable = rows.length;
  }
  const labels = {};
  for (const c of calls) labels[c.person] = (labels[c.person] || 0) + 1;
  for (const label of Object.keys(labels)) {
    if (!(label in importing.people)) importing.people[label] = label in saved ? saved[label] : matchPerson(label, employees);
  }
  const ready = calls.filter(c => importing.people[c.person]);
  return { calls, ready, labels, unreadable };
}

  const columns = COLUMNS.map(([k, label, required]) => `<label for="col-${k}">${label}</label>
    <select id="col-${k}" data-col="${k}">${required ? '' : '<option value="-1">— none —</option>'}

  const skipped = plan.calls.length - plan.ready.length;
  return `${intro}

    <div class="form">${columns}</div>
    ${names.length ? `<h3 class="sec">Who is who</h3>

    ${plan.ready.length ? `<h3 class="sec">Preview</h3><div class="tablewrap"><table>
      <tr><th>Person</th><th>Started</th><th class="n">Length</th><th>Direction</th><th>Result</th></tr>
      ${plan.ready.slice(0, 5).map(c => `<tr><td>${esc(data.employees.find(e => e.id === importing.people[c.person]).name)}</td>
        <td class="when">${esc(new Date(c.start).toLocaleString([], { month: 'short', day: 'numeric', hour: 'numeric', minute: '2-digit' }))}</td>
        <td class="n">${len(c.seconds)}</td><td>${esc(c.direction || '–')}</td><td>${esc(c.outcome.replace('-', ' '))}</td></tr>`).join('')}
    </table></div>` : ''}
    <p class="note" style="margin-top:10px">${plan.ready.length} calls ready${skipped ? ` · ${skipped} skipped (person not matched)` : ''}${plan.unreadable ? ` · ${plan.unreadable} row${plan.unreadable === 1 ? '' : 's'} without a readable date, duration or person` : ''}.
      Times are read in this computer's time zone.</p>
    <div style="margin-top:12px"><button class="btn primary" data-import ${plan.ready.length && !importing.busy ? '' : 'disabled'}>Import ${plan.ready.length} calls</button>
      <button class="btn" data-import-cancel>Cancel</button>${importing.result ? `<span class="saved">${esc(importing.result)}</span>` : ''}</div>
  </div>`;
}

async function runImport() {
  const plan = importPlan();
  const names = Object.fromEntries(data.employees.map(e => [e.id, e.name]));
  const calls = plan.ready.map(c => ({
    employee: names[importing.people[c.person]],
    callId: `nextiva:${c.start}:${c.seconds}`,
    startedAt: c.start,
    durationSeconds: c.seconds,
    direction: c.direction,
    outcome: c.outcome,
  }));
  importing.busy = true;
  importing.result = 'Importing…';
  render();
  try {
    for (let i = 0; i < calls.length; i += 500) {
      await api('api/calls', { method: 'POST', body: JSON.stringify({ calls: calls.slice(i, i + 500) }) });
    }
    const phoneUsers = { ...data.settings.phoneUsers, ...importing.people };
    data.settings = await api('api/settings', { method: 'PUT', body: JSON.stringify({ ...data.settings, phoneUsers }) });
    importing.result = `✓ ${calls.length} calls imported. They now count in Live, the activity logs and Reports.`;
  } catch (err) {
    importing.result = err.message === 'unauthorized' ? '' : `Couldn't import: ${err.message}`;
  }
  importing.busy = false;
  render();
}

function cleanDomain(v) {
  v = v.trim().toLowerCase();
  if (v.startsWith('(')) return v;
  try { return new URL(v.includes('://') ? v : `https://${v}`).hostname.replace(/^www\./, ''); } catch { return ''; }
}

      ${view === 'live' ? `<button class="btn" id="tvBtn">${tv ? 'Exit TV mode' : '📺 TV mode'}</button>` : ''}
    </div>
    ${error ? `<div class="banner">${esc(error)}</div>` : ''}
    ${body}`;
  for (const s of app.querySelectorAll('details > summary')) if (opened.has(s.textContent)) s.parentElement.open = true;
  window.scrollTo(0, scroll);
}

// ---------- events ----------

window.addEventListener('hashchange', () => {
  const before = view;
  route();
  if (view === 'person') person = null;
  // Settings loads today's list of people; Live may be showing another day.
  if (before !== view && (view === 'live' || view === 'settings') && !isToday()) data = null;
  if (before !== view || view === 'person') window.scrollTo(0, 0);
  render();
  refresh();
});

document.addEventListener('click', ev => {
  const link = ev.target.closest('a[data-date]');
  if (link) date = link.dataset.date; // a timesheet row opens that day
  const el = ev.target.closest('button');
  if (!el) return;
  if (el.id === 'tvBtn') {
    tv = !tv;
    const url = new URL(location.href);
    tv ? url.searchParams.set('tv', '1') : url.searchParams.delete('tv');
    history.replaceState(null, '', url);
    if (tv && document.documentElement.requestFullscreen) document.documentElement.requestFullscreen().catch(() => {});
    if (!tv && document.fullscreenElement) document.exitFullscreen().catch(() => {});
    refresh();
  } else if (el.dataset.day !== undefined) {
    const step = Number(el.dataset.day);
    const d = step === 0 ? new Date() : new Date(`${date}T12:00:00`);
    d.setDate(d.getDate() + step);
    date = localDate(d);
    data = null;
    person = null;
    refresh();
  } else if (el.dataset.preset) {
    [rangeFrom, rangeTo] = preset(el.dataset.preset);
    range = null;
    render();
    refresh();
  } else if (el.dataset.import !== undefined) {
    runImport();
  } else if (el.dataset.importCancel !== undefined) {
    importing = null;
    render();
  } else if (el.dataset.csv) {
    exportCsv(el.dataset.csv);
  } else if (el.dataset.print !== undefined) {
    document.querySelectorAll('details').forEach(d => (d.open = true));
    window.print();
  } else if (el.dataset.unassign) {
    const domains = { ...cats.domains };
    delete domains[el.dataset.unassign];
    saveCats({ ...cats, domains });
  } else if (el.dataset.delcat !== undefined) {
    saveCats({ ...cats, categories: cats.categories.filter((_, i) => i !== Number(el.dataset.delcat)) });
  }
});

document.addEventListener('change', ev => {
  const el = ev.target;
  if (el.id === 'date' && el.value) {
    date = el.value;
    data = null;
    person = null;
    refresh();
  } else if ((el.id === 'rangeFrom' || el.id === 'rangeTo') && el.value) {
    if (el.id === 'rangeFrom') rangeFrom = el.value;
    else rangeTo = el.value;
    if (rangeFrom > rangeTo) [rangeFrom, rangeTo] = [rangeTo, rangeFrom];
    range = null;
    render();
    refresh();
  } else if (el.id === 'showShort' || el.id === 'newestFirst') {
    if (el.id === 'showShort') showShort = el.checked;
    else newestFirst = el.checked;
    render();
  } else if (el.id === 'callFile' && el.files[0]) {
    readCallFile(el.files[0]);
  } else if (el.dataset.col) {
    importing.map[el.dataset.col] = Number(el.value);
    render();
  } else if (el.dataset.person !== undefined && importing) {
    importing.people[el.dataset.person] = el.value;
    render();
  } else if (el.dataset.shiftmode) {
    const people = { ...data.settings.people };
    if (el.value === 'team') delete people[el.dataset.shiftmode];
    else people[el.dataset.shiftmode] = { shiftStart: el.value === 'none' ? '' : data.settings.shiftStart || '09:00' };
    saveSettings({ ...data.settings, people });
  } else if (el.dataset.shift && el.value) {
    saveSettings({ ...data.settings, people: { ...data.settings.people, [el.dataset.shift]: { shiftStart: el.value } } });
  } else if (el.dataset.assign && el.value) {
    saveCats({ ...cats, domains: { ...cats.domains, [el.dataset.assign]: el.value } });
  } else if (el.dataset.work !== undefined) {
    saveCats({ ...cats, categories: cats.categories.map((c, i) => (i === Number(el.dataset.work) ? { ...c, work: el.checked } : c)) });
  }
});

document.addEventListener('submit', ev => {
  const form = ev.target;
  if (form.id === 'addSite') {
    ev.preventDefault();
    const domain = cleanDomain(form.domain.value);
    if (domain) saveCats({ ...cats, domains: { ...cats.domains, [domain]: form.category.value } });
  } else if (form.id === 'addCat') {
    ev.preventDefault();
    const name = form.name.value.trim();
    if (name) saveCats({ ...cats, categories: [...cats.categories, { name, work: form.work.checked }] });
  } else if (form.id === 'settingsForm') {
    ev.preventDefault();
    const f = new FormData(form);
    const next = { ...data.settings, shiftStart: f.get('shiftStart') || '', workdays: f.getAll('workdays').map(Number), nudges: form.nudges.checked };
    for (const name of ['lateGraceMinutes', 'lunchMinutes', 'breakMinutes', 'idleAlertMinutes', 'nonWorkAlertMinutes', 'nonWorkDayMinutes', 'offlineAlertMinutes']) {
      next[name] = Number(f.get(name));
    }
    saveSettings(next);
  }
});

// Shared hover tooltip for timeline runs and bars.
const tip = document.getElementById('tip');
document.addEventListener('mousemove', ev => {
  const el = ev.target.closest('[data-tip]');
  if (!el) return (tip.style.display = 'none');
  tip.textContent = el.dataset.tip;
  tip.style.display = 'block';
  const x = Math.min(ev.clientX + 12, window.innerWidth - tip.offsetWidth - 8);
  tip.style.left = `${x}px`;
  tip.style.top = `${ev.clientY + 16}px`;
});

route();
refresh();
setInterval(() => {
  // Live and person views follow the day as it happens; reports and settings wait for the reader.
  // Don't redraw under someone who is picking a category.
  if (view !== 'live' && view !== 'person') return;
  if (!document.activeElement || !document.activeElement.closest('.admin')) refresh();
}, 30000);
</script>
</body>
