; Sube los límites de subida de archivos (ej. listas CSV grandes en
; Campañas) y el tiempo/memoria disponible para procesarlas.
; Solo tiene efecto si el hosting corre PHP como PHP-FPM (lo más común
; en Bluehost) — si no, simplemente se ignora sin causar ningún error.
upload_max_filesize = 20M
post_max_size = 21M
max_execution_time = 120
memory_limit = 256M
